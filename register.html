 <!DOCTYPE html>
<html lang="en">
  <head>
    <title>Tic Tac Toe - Login</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/styles.css">
  </head>
<body>

  <!-- Navigation Bar -->
  <nav>
    <a href="index.html">Home</a>
    <a href="play.html">Play Now</a>
    <a href="info.html">Info</a>
    <a href="leaderboard.html">Leaderboard</a>
  </nav>

  <!-- Page Header -->
  <header>
    <h1>ACCOUNT REGISTRATION</h1>
    <p>Please create an account to track your match history:</p>
  </header>

  <!-- Main Registration Content -->
  <main>
    <section style="max-width: 400px; margin: 0 auto; text-align: left;">
      <h2>Register</h2>

      <!-- Form prepared for future backend processing -->
      <form action="register.php" method="POST">
        <div style="margin-bottom: 16px;">
          <label for="username" style="font-weight: bold; display: block; margin-bottom: 6px;">Username:</label>
          <input type="text" id="reg-username" name="username" style="width: 100%; padding: 8px; box-sizing: border-box;" required>
        </div>

        <div style="margin-bottom: 24px;">
          <label for="password" style="font-weight: bold; display: block; margin-bottom: 6px;">Password:</label>
          <input type="password" id="reg-password" name="password" style="width: 100%; padding: 8px; box-sizing: border-box;" required>
        </div>
        <div style="margin-bottom: 24px;">
          <label for="confpword" style="font-weight: bold; display: block; margin-bottom: 6px;">Confirm Password:</label>
          <input type="password" id="reg-confirm-password" name="confirm_password" style="width: 100%; padding: 8px; box-sizing: border-box;" required>
        </div>  
        <div id="reg-message" style="margin-bottom: 12px; font-weight: bold;"></div>      
        <button type="submit" id="register-btn" class="game-btn">Register</button>
      </form>

      <p style="margin-top: 20px; font-size: 14px; text-align: center;">
        Already have an account? <a href="#" style="color: #5F259F; font-weight: bold;"><a href="login.html">Sign in here</a></a>
      </p>
    </section>
  </main>

  <!-- Shared Footer -->
  <footer> 
    <p>Tic Tac Toe Web Page Project</p>
  </footer>

  <script src="scripts/auth.js"></script>
  
</body>
</html>
