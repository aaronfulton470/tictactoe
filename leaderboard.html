 <!DOCTYPE html>
<html lang="en">
  <head>
    <title>Tic Tac Toe - Leaderboard</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/styles.css">
  </head>
<body>

  <!-- Navigation Bar -->
  <nav>
    <a href="index.html">Home</a>
    <a href="play.html">Play Now</a>
    <a href="info.html">Info</a>
    <a href="leaderboard.html" class="active">Leaderboard</a>
  </nav>

  <!-- Page Header -->
  <header>
    <h1>PLAYER RANKINGS</h1>
    <p>Top records and game statistics</p>
  </header>

  <!-- Main Stats Content -->
  <main>
    <section>
      <h2>Leaderboard</h2>
      <p>Live rankings based on win rate and total matches played.</p>

      <!-- Semantic Table for Win/Loss tracking -->
      <table style="width: 100%; max-width: 700px; margin: 30px auto; border-collapse: collapse;">
        <thead>
          <tr style="background-color: #5F259F; color: #FFFFFF;">
            <th style="padding: 12px; border: 1px solid #ddd;">Rank</th>
            <th style="padding: 12px; border: 1px solid #ddd;">Player</th>
            <th style="padding: 12px; border: 1px solid #ddd;">Wins</th>
            <th style="padding: 12px; border: 1px solid #ddd;">Losses</th>
            <th style="padding: 12px; border: 1px solid #ddd;">Win Rate</th>
          </tr>
        </thead>
        <tbody style="text-align: center;">
          <!-- Placeholder rows to demonstrate layout for Milestone 1 -->
          <tr style="background-color: #f9f9f9;">
            <td style="padding: 10px; border: 1px solid #ddd;">1</td>
            <td style="padding: 10px; border: 1px solid #ddd;">LumberjackAce</td>
            <td style="padding: 10px; border: 1px solid #ddd;">42</td>
            <td style="padding: 10px; border: 1px solid #ddd;">5</td>
            <td style="padding: 10px; border: 1px solid #ddd;">89.3%</td>
          </tr>
          <tr>
            <td style="padding: 10px; border: 1px solid #ddd;">2</td>
            <td style="padding: 10px; border: 1px solid #ddd;">PurpleAxe</td>
            <td style="padding: 10px; border: 1px solid #ddd;">38</td>
            <td style="padding: 10px; border: 1px solid #ddd;">12</td>
            <td style="padding: 10px; border: 1px solid #ddd;">76.0%</td>
          </tr>
          <tr style="background-color: #f9f9f9;">
            <td style="padding: 10px; border: 1px solid #ddd;">3</td>
            <td style="padding: 10px; border: 1px solid #ddd;">NacogdochesPro</td>
            <td style="padding: 10px; border: 1px solid #ddd;">29</td>
            <td style="padding: 10px; border: 1px solid #ddd;">14</td>
            <td style="padding: 10px; border: 1px solid #ddd;">67.4%</td>
          </tr>
        </tbody>
      </table>
    </section>
  </main>

  <!-- Shared Footer -->
  <footer> 
    <p>Tic Tac Toe Web Page Project</p>
  </footer>

</body>
</html>
